<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Notas Fiscais - Sistema Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8fafc;
        }
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a192f, #1e3a8a);
            color: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
        }

        .sidebar .brand {
            font-size: 1.25rem;
            font-weight: bold;
            padding: 0 20px 20px;
            border-bottom: 1px solid #3d4452;
            text-align: center;
        }

        .sidebar .user-info {
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #3d4452;
        }

        .sidebar .nav-link {
            color: #b8c1ec;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #3d4452;
            color: #ffffff;
            border-left: 4px solid #0d6efd;
        }

        /* Conteúdo Principal */
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .card-custom {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
            margin-bottom: 25px;
            padding: 20px;
        }

        .card-title-custom {
            font-size: 1rem;
            font-weight: 600;
            color: #0d6efd;
            margin-bottom: 15px;
        }

        .table-custom thead {
            background-color: #f8f9fa;
            color: #0d6efd;
        }

        .table-custom th {
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
        }
    </style>
</head>
<body>

<!-- Sidebar Lateral -->
<div class="sidebar">
    <div class="brand">Projeto Financeiro</div>

    <div class="user-info">
        <i class="fa-solid fa-circle-user fa-2x mb-2"></i>
        <div class="fw-bold" id="sidebar-username">USUÁRIO LOGADO</div>
        <span id="badgeUsuario" class="badge bg-primary mt-1">Financeiro</span>
        <button class="btn btn-sm btn-outline-light w-100 mt-3" onclick="fazerLogout()">
            <i class="fa-solid fa-right-from-bracket me-1"></i> Sair
        </button>
    </div>

    <div class="mt-3">
        <a href="/extrairdados" class="nav-link">
            <i class="fa-solid fa-file-invoice"></i> Extrair Nota
        </a>
        <a href="/historico" class="nav-link">
            <i class="fa-solid fa-clock-rotate-left"></i> Histórico de NFs
        </a>
        <a href="/categorias" class="nav-link active">
            <i class="fa-solid fa-briefcase"></i> Categorias
        </a>
        <a href="/configuracao" class="nav-link">
            <i class="fa-solid fa-sliders"></i> configuração
        </a>
    </div>
</div>

<!-- Conteúdo Principal -->
<div class="main-content">
    <h3 class="fw-bold mb-4">Gestão do Banco de Dados</h3>

    <!-- 1. Dropdown para selecionar o Banco / Entidade -->
    <div class="card-custom mb-3">
        <label class="form-label fw-bold text-primary mb-2">
            <i class="fa-solid fa-database me-1"></i> Selecione os dados a consultar:
        </label>
        <select id="selectEntidade" class="form-select form-select-lg fw-semibold" onchange="trocarEntidade()">
            <option value="faturado" selected>Faturado (Compradores/Contratadores/Consumidores)</option>
            <option value="fornecedor">Fornecedor (Empresas/Prestadores/)</option>
            <option value="classificacao">Classificação (Tipos de Despesas/Receitas)</option>
        </select>
    </div>

    <!-- 2. Barra de Busca e Botões -->
    <div class="card-custom mb-4">
        <div class="row g-2">
            <div class="col-md-8">
                <input type="text" id="inputBuscaGerencia" class="form-control form-control-lg" placeholder="Pesquise por nome, CPF/CNPJ, descrição ou tipo">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-1 fw-bold" onclick="buscarDadosEntidade()">
                    <i class="fa-solid fa-magnifying-glass"></i> Pesquisar
                </button>
                <button class="btn btn-success w-100 d-flex align-items-center justify-content-center gap-1 fw-bold" onclick="buscarTodosEntidade()">
                    <i class="fa-solid fa-list-check"></i> Todos
                </button>
            </div>
        </div>
    </div>

    <!-- 3. Tabela Dinâmica com base na opção selecionada -->
    <div class="card-custom">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="card-title-custom m-0" id="tituloTabelaDinamica">Registros de Faturados/Clientes</div>
            <button class="btn btn-sm btn-outline-primary fw-bold" id="buttonInativos">
                <i class="fa-solid fa-box-archive me-1"></i> Mostrar Registros Deletados
            </button>
            <button class="btn btn-sm btn-outline-primary fw-bold" id="buttonAdd">
                <i class="fa-solid fa-plus me-1"></i> Novo Cadastrado
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle table-custom">
                <thead id="cabecalhoTabelaDinamica">
                <!-- Preenchido Dinamicamente via JS -->
                </thead>
                <tbody id="corpoTabelaDinamica">
                <tr>
                    <td colspan="5" class="text-center text-muted py-4">
                        Clique em <strong>Pesquisar</strong> ou <strong>Todos</strong> para carregar os registros.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal gerencia para Cadastro e Edição -->
<div class="modal fade" id="modalGerencia" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalGerenciaLabel">Editar Registro</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formGerencia">
                    <input type="hidden" id="modalRegistroId">

                    <div class="mb-3" id="campoNomeContainer">
                        <label class="form-label fw-semibold" id="labelNome">Nome / Razão Social</label>
                        <input type="text" id="inputNomeModal" class="form-control" required>
                    </div>

                    <div class="mb-3" id="campoDocContainer">
                        <label class="form-label fw-semibold" id="labelDoc">CPF / CNPJ</label>
                        <input type="text" id="inputDocModal" class="form-control">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="buttonSaveGerencia" onclick="salvarRegistroModal()">Salvar Alterações</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalFat" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalFatLabel">Editar Registro</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formfat">
                    <input type="hidden" id="modalFatId">

                    <div class="mb-3" id="campoNomeFatContainer">
                        <label class="form-label fw-semibold" id="labelNomeFat">Nome / Razão Social</label>
                        <input type="text" id="inputNomeModalFat" class="form-control" required>
                    </div>

                    <div class="mb-3" id="campoDocFatContainer">
                        <label class="form-label fw-semibold" id="labelDocFat">CPF / CNPJ</label>
                        <input type="text" id="inputDocModalFat" class="form-control">
                    </div>
                    <div class="mb-3 d-none" id="campoContainer">
                        <label class="form-label fw-semibold">Tipo</label>
                        <select id="modalRegistroOrigem" class="form-select">
                            <option value="Faturado">Faturado</option>
                            <option value="Cliente">Cliente</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="buttonSave" onclick="salvarRegistroModalFat()">Salvar Alterações</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal classificação para Cadastro e Edição -->
<div class="modal fade" id="modalGerenciaClass" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalGerenciaClassLabel">Editar Registro</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formGerenciaClass">
                    <input type="hidden" id="modalRegistroClassId">

                    <div class="mb-3" id="campoTituloContainer">
                        <label class="form-label fw-semibold" id="labelTitulo">Titulo</label>
                        <input type="text" id="inputTituloModal" class="form-control" required>
                    </div>

                    <div class="mb-3" id="campoDescContainer">
                        <label class="form-label fw-semibold" id="labelDesc">Descrição</label>
                        <input type="text" id="inputDescModal" class="form-control">
                    </div>

                    <div class="mb-3" id="campoTipoContainer">
                        <label class="form-label fw-semibold">Tipo (Classificação)</label>
                        <select id="selectTipoClassificacao" class="form-select">
                            <option value="Despesa">Despesa</option>
                            <option value="Receita">Receita</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="ButtonSaveClass" onclick="salvarRegistroModalClass()">Salvar Alterações</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/Main.js"></script>

<script>
    let modalInstanceGerencia = null;
    let modalInstanceFat = null;
    let modalInstanceClass = null;
    let registrosAtuais = [];

    document.addEventListener('DOMContentLoaded', () => {
        modalInstanceGerencia = new bootstrap.Modal(document.getElementById('modalGerencia'));
        modalInstanceFat = new bootstrap.Modal(document.getElementById('modalFat'));
        modalInstanceClass = new bootstrap.Modal(document.getElementById('modalGerenciaClass'));
        trocarEntidade(); // Configura os cabeçalhos iniciais
    });

    // 1. Troca as colunas da tabela conforme o dropdown selecionado
    function trocarEntidade() {
        const entidade = document.getElementById('selectEntidade').value;
        const cabecalho = document.getElementById('cabecalhoTabelaDinamica');
        const titulo = document.getElementById('tituloTabelaDinamica');
        const add = document.getElementById('buttonAdd');
        const inativos = document.getElementById('buttonInativos');
        const corpo = document.getElementById('corpoTabelaDinamica');
        const id = null;
        const origem = null;

        corpo.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Clique em <strong>Pesquisar</strong> ou <strong>Todos</strong> para carregar os dados de ${entidade.toUpperCase()}.</td></tr>`;

        if (entidade === 'faturado') {
            titulo.textContent = 'Registros de Faturados';
            add.onclick = function () {abrirModalEditarFatClass(id,origem)};
            inativos.onclick = function () {buscarInativos()};
            cabecalho.innerHTML = `
                <tr>
                    <th>Classificação</th>
                    <th>Nome Completo</th>
                    <th>CPF/CNPJ</th>
                    <th class="text-center">Ações</th>
                </tr>`;
        } else if (entidade === 'fornecedor') {
            titulo.textContent = 'Registros de Fornecedores';
            add.onclick = function () {abrirModalEditar(id)};
            inativos.onclick = function () {buscarInativos()};
            cabecalho.innerHTML = `
                <tr>
                    <th>Razão Social</th>
                    <th>CPF/CNPJ</th>
                    <th class="text-center">Ações</th>
                </tr>`;
        } else if (entidade === 'classificacao') {
            titulo.textContent = 'Registros de Classificação (Despesa e Receita)';
            add.onclick = function () {abrirModalEditarFatClass(id,origem)};
            inativos.onclick = function () {buscarInativos()};
            cabecalho.innerHTML = `
                <tr>
                    <th>Tipo</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th class="text-center">Ações</th>
                </tr>`;
        }
    }

    // 2. Busca com filtro digitado
    function buscarDadosEntidade() {
        const termo = document.getElementById('inputBuscaGerencia').value.trim();
        executarConsulta(termo);
    }

    // 3. Busca todos os registros sem filtro
    function buscarTodosEntidade() {
        document.getElementById('inputBuscaGerencia').value = '';
        executarConsulta('');
    }

    // 4. Executa a requisição no backend
    async function executarConsulta(termo) {
        const entidade = document.getElementById('selectEntidade').value;
        const corpo = document.getElementById('corpoTabelaDinamica');

        corpo.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4"><i class="fa-solid fa-spinner fa-spin me-2"></i> Carregando registros...</td></tr>`;

        try {
            const response = await fetch(`/api/gerencia/buscar?entidade=${entidade}&termo=${encodeURIComponent(termo)}`);
            const result = await response.json();

            if (!result.success) {
                corpo.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Erro ao carregar dados.</td></tr>`;
                return;
            }

            registrosAtuais = result.data;
            renderizarLinhasTabela(entidade, registrosAtuais);

        } catch (err) {
            console.error('Erro na consulta:', err);
            corpo.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Erro de conexão com o servidor.</td></tr>`;
        }
    }

    // 5. Renderiza dinamicamente o corpo da tabela
    function renderizarLinhasTabela(entidade, lista) {
        const corpo = document.getElementById('corpoTabelaDinamica');

        if (!lista || lista.length === 0) {
            corpo.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Nenhum registro encontrado.</td></tr>`;
            return;
        }

        corpo.innerHTML = lista.map(item => {
            if (entidade === 'faturado') {
                return `
                <tr>
                    <td><span class="badge bg-primary rounded-pill px-3 py-2 fw-semibold">${item.origem || 'N/A'}</span></td>
                    <td>${item.nome || 'N/A'}</td>
                    <td>${item.doc || 'N/A'}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirModalEditarFatClass(${item.id}, '${item.origem}')"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletarRegistroFatClass(${item.id}, '${item.origem}')"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            } else if (entidade === 'fornecedor') {
                return `
                <tr>
                    <td>${item.razao_social || 'N/A'}</td>
                    <td>${item.cnpj || 'N/A'}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirModalEditar(${item.id})"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletarRegistro(${item.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            } else if (entidade === 'faturado') {
                return `
                <tr>
                    <td>${item.nome || 'N/A'}</td>
                    <td>${item.cpf_cnpj || 'N/A'}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirModalEditar(${item.id})"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletarRegistro(${item.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            } else if (entidade === 'classificacao') {
                return `
                <tr>
                    <td><span class="badge ${item.tipo === 'Despesa' ? 'bg-danger' : 'bg-success'}">${item.tipo}</span></td>
                    <td>${item.categoria_pai || 'Geral'}</td>
                    <td>${item.descricao || '-'}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirModalEditarFatClass(${item.id}, '${item.tipo}')"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletarRegistroFatClass(${item.id}, '${item.tipo}')"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            }
        }).join('');
    }

    // Modal para novo / editar
    function abrirModalEditar(id) {
        let item = registrosAtuais;

        if (id) {
            item = registrosAtuais.find(r => r.id === id);
            if (!item) return;

            document.getElementById('modalRegistroId').value = item.id;
            document.getElementById('inputNomeModal').value = item.razao_social || '';
            document.getElementById('inputDocModal').value = item.cnpj || '';

            modalInstanceGerencia.show();

        } else {
            document.getElementById('modalGerenciaLabel').textContent = 'Criar Registro';
            document.getElementById('buttonSaveGerencia').textContent = 'Criar Novo Registro';
            document.getElementById('modalRegistroId').value = '';
            document.getElementById('inputNomeModal').value = '';
            document.getElementById('inputDocModal').value = '';

            modalInstanceGerencia.show();
        }
    }

    function abrirModalEditarFatClass(id, origem) {
        let item = registrosAtuais;
        const entidade = document.getElementById('selectEntidade').value;
        if (id && origem) {
            if (!item) return;

            if (entidade === 'faturado') {
                item = registrosAtuais.find(r => r.id === id && r.origem === origem);

                document.getElementById('modalFatId').value = item.id;
                document.getElementById('modalRegistroOrigem').value = origem;
                document.getElementById('inputNomeModalFat').value = item.nome || '';
                document.getElementById('inputDocModalFat').value = item.doc || '';

                modalInstanceFat.show();
            } else if (entidade === 'classificacao') {
                item = registrosAtuais.find(r => r.id === id && r.tipo === origem);

                document.getElementById('modalRegistroClassId').value = item.id;
                document.getElementById('inputTituloModal').value = item.categoria_pai || '';
                document.getElementById('inputDescModal').value = item.descricao || '';
                document.getElementById('selectTipoClassificacao').value = item.tipo || '';

                modalInstanceClass.show();
            }
        } else {
            if (entidade === 'faturado') {
                document.getElementById('modalFatLabel').textContent = 'Criar Registro';
                document.getElementById('buttonSave').textContent = 'Criar Novo Registro';
                document.getElementById('campoContainer').classList.remove('d-none');
                document.getElementById('modalRegistroOrigem').value = 'Faturado';
                document.getElementById('modalFatId').value = '';
                document.getElementById('inputNomeModalFat').value = '';
                document.getElementById('inputDocModalFat').value = '';

                modalInstanceFat.show();
            } else if (entidade === 'classificacao') {
                document.getElementById('modalGerenciaClassLabel').textContent = 'Criar Registro';
                document.getElementById('ButtonSaveClass').textContent = 'Criar Novo Registro';
                document.getElementById('modalRegistroClassId').value = '';
                document.getElementById('inputTituloModal').value = '';
                document.getElementById('inputDescModal').value = '';
                document.getElementById('selectTipoClassificacao').value = 'Despesa';

                modalInstanceClass.show();
            }
        }
    }

    async function salvarRegistroModal() {
        const id = document.getElementById('modalRegistroId').value;
        const entidade = document.getElementById('selectEntidade').value;
        const nome = document.getElementById('inputNomeModal').value;
        const doc = document.getElementById('inputDocModal').value;

        const response = await fetch('/api/gerencia/salvar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, entidade, nome, doc })
        });

        const result = await response.json();
        if (result.success) {
            modalInstanceGerencia.hide();
            buscarDadosEntidade();
        } else {
            alert('Erro ao salvar: ' + result.error);
        }
    }

    async function salvarRegistroModalFat() {
        const id = document.getElementById('modalFatId').value;
        const entidade = document.getElementById('selectEntidade').value;
        const origem = document.getElementById('modalRegistroOrigem').value;
        const nome = document.getElementById('inputNomeModalFat').value;
        const doc = document.getElementById('inputDocModalFat').value;

        const response = await fetch('/api/gerencia/salvar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, entidade, origem, nome, doc })
        });

        const result = await response.json();
        if (result.success) {
            modalInstanceFat.hide();
            buscarDadosEntidade();
        } else {
            alert('Erro ao salvar: ' + result.error);
        }
    }

    async function salvarRegistroModalClass() {
        const idInput = document.getElementById('modalRegistroClassId').value;
        const entidade = document.getElementById('selectEntidade').value;
        const nome = document.getElementById('inputTituloModal').value;
        const desc = document.getElementById('inputDescModal').value;
        const tipo = document.getElementById('selectTipoClassificacao').value;
        const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));

        if (!nome) {
            alert('Por favor, informe a Categoria / Título!');
            return;
        }

        const payload = {
            id: idInput ? Number(idInput) : null,
            entidade: entidade,
            nome: nome,
            desc: desc,
            tipo: tipo,
            id_usuario: usuarioLogado.id
        };

        try {
            const response = await fetch('/api/gerencia/salvar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.success) {
                modalInstanceClass.hide();
                // Recarrega os dados da tabela
                buscarDadosEntidade();
            } else {
                alert('Erro ao salvar no banco: ' + result.error);
            }
        } catch (err) {
            console.error('Erro na requisição:', err);
            alert('Erro de comunicação com o servidor.');
        }
    }

    async function deletarRegistro(id) {
        if (!confirm('Deseja realmente excluir este registro?')) return;
        const entidade = document.getElementById('selectEntidade').value;

        const response = await fetch(`/api/gerencia/deletar?entidade=${entidade}&id=${id}`, { method: 'DELETE' });
        const result = await response.json();

        if (result.success) {
            buscarDadosEntidade();
        } else {
            alert('Erro ao excluir: ' + result.error);
        }
    }

    async function deletarRegistroFatClass(id, origem) {
        if (!confirm('Deseja realmente excluir este registro?')) return;
        const entidade = document.getElementById('selectEntidade').value;

        const response = await fetch(`/api/gerencia/deletar?entidade=${entidade}&id=${id}&origem=${origem}`, { method: 'DELETE' });
        const result = await response.json();

        if (result.success) {
            buscarDadosEntidade();
        } else {
            alert('Erro ao excluir: ' + result.error);
        }
    }

    async function buscarInativos() {
        const entidade = document.getElementById('selectEntidade').value;
        const response = await fetch(`/api/gerencia/inativos?entidade=${entidade}`);
        const result = await response.json();

        if (result.success) {
            console.log('Inativos encontrados:', result.data);
            renderizarLinhasTabela(entidade, result.data);
        }
    }
</script>
