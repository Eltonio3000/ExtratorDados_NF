<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Notas Fiscais - Sistema Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8fafc;
        }
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a192f, #1e3a8a);
            color: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 20px;
        }

        .sidebar .brand {
            font-size: 1.25rem;
            font-weight: bold;
            padding: 0 20px 20px;
            border-bottom: 1px solid #3d4452;
            text-align: center;
        }

        .sidebar .user-info {
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #3d4452;
        }

        .sidebar .nav-link {
            color: #b8c1ec;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #3d4452;
            color: #ffffff;
            border-left: 4px solid #0d6efd;
        }

        /* Conteúdo Principal */
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .card-custom {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
            margin-bottom: 25px;
            padding: 20px;
        }

        .card-title-custom {
            font-size: 1rem;
            font-weight: 600;
            color: #0d6efd;
            margin-bottom: 15px;
        }

        .table-custom thead {
            background-color: #f8f9fa;
            color: #0d6efd;
        }

        .table-custom th {
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
        }
    </style>
</head>
<body>

<!-- Sidebar Lateral -->
<div class="sidebar">
    <div class="brand">Projeto Financeiro</div>

    <div class="user-info">
        <i class="fa-solid fa-circle-user fa-2x mb-2"></i>
        <div class="fw-bold" id="sidebar-username">USUÁRIO LOGADO</div>
        <span id="badgeUsuario" class="badge bg-primary mt-1">Financeiro</span>
        <button class="btn btn-sm btn-outline-light w-100 mt-3" onclick="fazerLogout()">
            <i class="fa-solid fa-right-from-bracket me-1"></i> Sair
        </button>
    </div>

    <div class="mt-3">
        <a href="/extrairdados" class="nav-link">
            <i class="fa-solid fa-file-invoice"></i> Extrair Nota
        </a>
        <a href="/historico" class="nav-link">
            <i class="fa-solid fa-clock-rotate-left"></i> Histórico de NFs
        </a>
        <a href="/categorias" class="nav-link">
            <i class="fa-solid fa-briefcase"></i> Categorias
        </a>
        <a href="/configuracao" class="nav-link active">
            <i class="fa-solid fa-sliders"></i> configuração
        </a>
    </div>
</div>

<!-- Conteúdo Principal -->
<div class="main-content">
    <h3 class="fw-bold mb-4">Configurações da Conta</h3>

    <!-- Card de Informações e Edição do Perfil -->
    <div class="card-custom mb-4" style="max-width: 700px;">
        <div class="card-title-custom mb-3">
            <i class="fa-solid fa-user-gear me-1"></i> Dados do Usuário
        </div>

        <form id="formPerfil" onsubmit="salvarPerfil(event)">
            <!-- ID oculto do usuário -->
            <input type="hidden" id="userId">

            <div class="mb-3">
                <label class="form-label fw-semibold">Nome Completo</label>
                <input type="text" id="userNome" class="form-control form-control-lg" disabled>
                <div class="form-text">O nome é definido no cadastro inicial e não pode ser alterado.</div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Endereço de E-mail</label>
                <div class="input-group">
                    <input type="email" id="userEmail" class="form-control form-control-lg" required>
                    <button class="btn btn-primary px-4 fw-bold" type="submit" id="btnSalvarEmail">
                        <i class="fa-solid fa-pen-to-square me-1"></i> Salvar E-mail
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Card 2: Alterar Senha (com bcryptjs no backend) -->
    <div class="card-custom mb-4" style="max-width: 700px;">
        <div class="card-title-custom mb-3 text-primary">
            <i class="fa-solid fa-key me-1"></i> Alterar Senha
        </div>

        <form id="formSenha" onsubmit="alterarSenha(event)">
            <div class="mb-3">
                <label class="form-label fw-semibold">Senha Atual</label>
                <input type="password" id="senhaAtual" class="form-control" placeholder="Digite sua senha atual" required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nova Senha</label>
                    <input type="password" id="novaSenha" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Confirmar Nova Senha</label>
                    <input type="password" id="confirmarNovaSenha" class="form-control" placeholder="Repita a nova senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-warning fw-bold text-dark px-4">
                <i class="fa-solid fa-lock me-1"></i> Atualizar Senha
            </button>
        </form>
    </div>

    <!-- Card de Exclusão da Conta (Zona de Perigo) -->
    <div class="card-custom border-danger" style="max-width: 700px; background-color: #fff8f8;">
        <div class="card-title-custom text-danger mb-2">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> Excluir Conta
        </div>
        <p class="text-muted small mb-3">
            Ao desativar sua conta, seu acesso será imediatamente revogado.
        </p>

        <button class="btn btn-outline-danger fw-bold" onclick="confirmarExclusaoLogica()">
            <i class="fa-solid fa-user-slash me-1"></i> Excluir Minha Conta
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/Main.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        carregarPerfilUsuario();
    });

    // 1. Busca os dados do usuário atualmente autenticado
    async function carregarPerfilUsuario() {
        const usuarioStorage = localStorage.getItem('usuarioLogado');

        if (!usuarioStorage) {
            alert('Usuário não autenticado!');
            window.location.href = '/login';
            return;
        }

        // 1. Converte a string salva do localStorage para Objeto JavaScript
        const usuarioLogado = JSON.parse(usuarioStorage);
        const idUsuario = usuarioLogado.id;

        try {
            // 2. Passa o ID na URL (Query Parameter) em vez do body
            const response = await fetch(`/api/usuario/meu-perfil?id_usuario=${idUsuario}`);
            const result = await response.json();

            if (result.success && result.data) {
                document.getElementById('userId').value = result.data.id;
                document.getElementById('userNome').value =  result.data.nome_completo;
                document.getElementById('userEmail').value = result.data.email;
            } else {
                alert('Sessão expirada ou usuário não encontrado.');
                window.location.href = '/login';
            }
        } catch (err) {
            console.error('Erro ao carregar perfil:', err);
        }
    }

    // 2. Atualiza apenas o e-mail do usuário
    async function salvarPerfil(event) {
        event.preventDefault();

        const id = document.getElementById('userId').value;
        const email = document.getElementById('userEmail').value.trim();

        if (!email) {
            alert('Por favor, informe um e-mail válido!');
            return;
        }

        try {
            const response = await fetch('/api/usuario/atualizar-email', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, email })
            });

            const result = await response.json();

            if (result.success) {
                alert('E-mail atualizado com sucesso!');
                carregarPerfilUsuario();
            } else {
                alert('Erro ao atualizar e-mail: ' + (result.error || 'Tente novamente.'));
            }
        } catch (err) {
            console.error('Erro ao salvar e-mail:', err);
            alert('Erro de comunicação com o servidor.');
        }
    }

    // 3. Altera a Senha do Usuário
    async function alterarSenha(event) {
        event.preventDefault();

        const id = document.getElementById('userId').value;
        const senhaAtual = document.getElementById('senhaAtual').value;
        const novaSenha = document.getElementById('novaSenha').value;
        const confirmarNovaSenha = document.getElementById('confirmarNovaSenha').value;

        if (novaSenha !== confirmarNovaSenha) {
            alert('A nova senha e a confirmação não conferem!');
            return;
        }

        if (novaSenha.length < 6) {
            alert('A nova senha deve ter no mínimo 6 caracteres.');
            return;
        }

        try {
            const response = await fetch('/api/usuario/alterar-senha', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id,
                    senhaAtual,
                    novaSenha
                })
            });

            const result = await response.json();

            if (result.success) {
                alert('Senha alterada com sucesso!');
                document.getElementById('formSenha').reset();
            } else {
                alert('Erro ao alterar senha: ' + (result.error || 'Verifique a senha atual.'));
            }
        } catch (err) {
            console.error('Erro ao alterar senha:', err);
            alert('Erro de comunicação com o servidor.');
        }
    }

    // 3. Executa a exclusão lógica (Inativação) do usuário
    async function confirmarExclusaoLogica() {
        const confirmacao = confirm(
            'ATENÇÃO: Você tem certeza que deseja excluir/desativar sua conta?\n\nSeu acesso será encerrado imediatamente.'
        );

        if (!confirmacao) return;

        const id = document.getElementById('userId').value;

        try {
            const response = await fetch(`/api/usuario/inativar/${id}`, {
                method: 'PATCH'
            });

            const result = await response.json();

            if (result.success) {
                alert('Sua conta foi inativada com sucesso!');
                // Redireciona para o logout/login
                if (typeof fazerLogout === 'function') {
                    fazerLogout();
                } else {
                    window.location.href = '/login';
                }
            } else {
                alert('Erro ao inativar conta: ' + (result.error || 'Erro interno.'));
            }
        } catch (err) {
            console.error('Erro ao inativar conta:', err);
            alert('Erro de conexão com o servidor.');
        }
    }
</script>

</body>
</html>
